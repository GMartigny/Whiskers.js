name: CI

on:
  workflow_dispatch:
  pull_request:
  push:
    branches:
      - main
    tags:
      - "v*"

permissions:
  contents: read

concurrency:
  group: "${{ github.workflow }}-${{ github.ref }}"
  cancel-in-progress: true

jobs:
  Check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      # Feeds the live coverage badge of the readme (the repo is created on coveralls.io by the first upload)
      - uses: coverallsapp/github-action@v2
        if: github.ref_type == 'branch'
        with:
          file: coverage/lcov.info
          fail-on-error: false

  Publish:
    needs: Check
    # Publishing is triggered by pushing a version tag (npm version creates it)
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: read
      # Lets npm exchange the workflow identity for a short-lived publish credential
      # (trusted publishing, configured on npmjs.com). No NPM_TOKEN secret is needed.
      id-token: write
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          registry-url: https://registry.npmjs.org
      - run: npm ci
      - run: npm run build
      - uses: JS-DevTools/npm-publish@v4
        with:
          access: public
          provenance: true
